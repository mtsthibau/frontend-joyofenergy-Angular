name: Build and publish

on:
  push:
  pull_request:

jobs:
  build:
    # permissions:
      # contents: read
    runs-on: self-hosted
    # runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4

      - name: Setup node/npm
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run:  npm install

      - name: Build project
        run: ng build
        working-directory: ./src/


      - name: Run unit tests via Karma
        run: ng test
        working-directory: ./src/

      # - name: Run e2e tests
      #   uses: cypress-io/github-action@v6
      #   with:
      #     build: npm run build
      #     start: npm start
      #     working-directory: ./src/

      # - name: Setup Docker Buildx
      #   uses: docker/setup-buildx-action@v3

      # - name: Build and push
      #   uses: docker/build-push-action@v6
      #   with:
      #     push: true
      #     tags: joyofenergy:latest

      - uses: actions/upload-artifact@v4
        with:
          name: joyofenergy-artifact
          path: ./dist/angular-front-end-developer-joyofenergy
